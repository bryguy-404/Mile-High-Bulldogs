        label: Navigation links
        type: object
        required: true
        fields:
          - name: events
            label: Events
            type: object
            required: true
            fields:
              - name: label
                label: Link text
                type: string
                required: true
              - name: href
                label: Destination
                type: string
                required: true
                description: An existing homepage section or a complete https:// link.
                pattern:
