  - name: shared
    label: 7 · Shared Information
    type: file
    path: src/content/shared.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: name
        label: Organization name
        type: string
        required: true
      - name: tagline
        label: Shared tagline
        type: string
        required: true
        description: Updates the date banner, both story sections, and footer.
      - name: facebookUrl
        label: Facebook group link
        type: string
        required: true
        description: Use a complete https:// link.
        pattern:
          regex: ^https?://[^\s]+$
          message: Enter a valid link.
      - name: instagramUrl
        label: Instagram link
        type: string
        required: true
        description: Use a complete https:// link.
        pattern:
          regex: ^https?://[^\s]+$
          message: Enter a valid link.
      - name: ticketLabel
        label: Ticket button text
        type: string
        required: true
        description: Updates all ticket buttons. Set the destination under Featured Event.
      - name: groupLabel
        label: Join group button text
        type: string
        required: true
      - name: swagLabel
        label: Swag button text
        type: string
        required: true
      - name: swagStatus
        label: Swag availability text
        type: string
        required: true
      - name: swagNotice
        label: Swag button explanation
        type: string
        required: true
        description: The swag button remains disabled until a developer enables the shop.
