# Fixed homepage sections. Keep routes, layout, and scripts outside the editor.
media:
  input: public/uploads
  output: /uploads
  extensions:
    - jpg
    - jpeg
    - png
    - webp
    - avif
  rename: random
content:
  - name: hero
    label: 1 · Hero
    type: file
    path: src/content/hero.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: eyebrow
        label: Intro label
        type: string
        required: true
      - name: heading
        label: Three-line heading
        type: object
        required: true
        fields:
          - name: line1
            label: First line
            type: string
            required: true
          - name: line2
            label: Highlighted second line
            type: string
            required: true
          - name: line3
            label: Third line
            type: string
            required: true
      - name: description
        label: Introduction
        type: text
        required: true
      - name: poster
        label: Video poster / reduced-motion background
        type: image
        required: true
        description: Shown while the video loads and when visitors prefer reduced motion. The video itself
          stays managed in code.
  - name: featured-event
    label: 2 · Featured Event
    type: file
    path: src/content/featured-event.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: calendarLabel
        label: Calendar label
        type: string
        required: true
      - name: eyebrow
        label: Section label
        type: string
        required: true
      - name: matchup
        label: Matchup (screen reader heading)
        type: string
        required: true
      - name: versusLabel
        label: Text between team graphics
        type: string
        required: true
      - name: teams
        label: Team graphics
        type: object
        required: true
        fields:
          - name: home
            label: Left team
            type: object
            required: true
            fields:
              - name: image
                label: Photo
                type: image
                required: true
              - name: imageAlt
                label: Photo description (accessibility)
                type: string
                required: true
          - name: away
            label: Right team
            type: object
            required: true
            fields:
              - name: image
                label: Photo
                type: image
                required: true
              - name: imageAlt
                label: Photo description (accessibility)
                type: string
                required: true
      - name: description
        label: Event description
        type: text
        required: true
      - name: date
        label: Event date
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: time
        label: Event time
        type: string
        required: true
        description: Include the local time and timezone when appropriate.
      - name: venue
        label: Venue
        type: string
        required: true
      - name: pregame
        label: Pregame details
        type: string
        required: true
      - name: ticketDeadline
        label: Ticket purchase deadline
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: ticketUrl
        label: Ticket purchase link
        type: string
        required: true
        description: Use a complete https:// link.
        pattern:
          regex: ^https?://[^\s]+$
          message: Enter a valid link.
      - name: flyerUrl
        label: Event flyer link
        type: string
        required: true
        description: Use an https:// URL or the existing /downloads/ PDF path.
        pattern:
          regex: ^(https?://[^\s]+|/downloads/[^\s]+\.pdf)$
          message: Enter a valid link.
      - name: flyerLabel
        label: Flyer button text
        type: string
        required: true
      - name: image
        label: Event photo
        type: image
        required: true
      - name: imageAlt
        label: Photo description (accessibility)
        type: string
        required: true
      - name: imageCaption
        label: Photo caption
        type: string
        required: true
      - name: labels
        label: Detail labels
        type: object
        required: true
        fields:
          - name: game
            label: Game
            type: string
            required: true
          - name: venue
            label: Venue
            type: string
            required: true
          - name: pregame
            label: Pregame
            type: string
            required: true
          - name: deadline
            label: Deadline
            type: string
            required: true
      - name: contact
        label: Event contact
        type: object
        required: true
        fields:
          - name: prompt
            label: Contact introduction
            type: string
            required: true
          - name: name
            label: Name
            type: string
            required: true
          - name: email
            label: Email
            type: string
            required: true
            pattern:
              regex: ^[^\s@]+@[^\s@]+\.[^\s@]+$
              message: Enter an email address.
          - name: phone
            label: Phone number
            type: string
            required: true
            description: Include a country code for numbers outside the US. The tap-to-call link is generated
              automatically.
